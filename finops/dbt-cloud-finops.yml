description: >-
  FinOps view of dbt Cloud spend. dbt Cloud bills seat-based subscriptions
  (per developer seat per month) with usage allowances metered by successful
  models built per month and, for the Semantic Layer, queried metrics per month.
  Developer is free for one seat; Starter is a flat per-seat fee; Enterprise and
  Enterprise+ are negotiated. Cost optimization centers on controlling seat
  counts, model-build volume, and metric query volume against plan allowances.
notes: >-
  Per-plan prices and allowances are subject to change; verify against the dbt
  pricing page during reconciliation.
sources:
- https://www.getdbt.com/pricing
- https://docs.getdbt.com/docs/dbt-cloud-apis/overview
- https://focus.finops.org/focus-specification/v1-3/
