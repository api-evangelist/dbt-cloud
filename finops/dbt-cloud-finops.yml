meters:
- name: developer_seats
  description: Active developer seats on the subscription, billed per seat per month.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - plan
- name: models_built
  description: Successful models built per month, metered against the plan allowance.
  unit: models
  aggregation: sum
  dimensions:
  - account
  - project
- name: queried_metrics
  description: Semantic Layer metrics queried per month, metered against the plan allowance.
  unit: metrics
  aggregation: sum
  dimensions:
  - account
  - project
- name: projects
  description: Number of projects in the account, capped by plan tier.
  unit: projects
  aggregation: max
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track seat utilization, monthly successful model builds, and queried metrics against plan allowances in the dbt Cloud console.
- name: Allocation
  description: Map projects and seats to teams and cost centers; tag jobs and environments by workload.
- name: Optimization
  description: Right-size seat counts, consolidate and schedule jobs to reduce redundant model builds, and prune unused metrics to stay within allowances.
- name: Accountability
  description: Assign project owners; review seat, model-build, and metric-query trends monthly against budget and plan tier.
