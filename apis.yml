    type: Documentation
  - url: https://docs.getdbt.com/docs/dbt-apis/discovery-querying
    type: APIReference
  description: >-
    GraphQL API for fetching metadata about the state and health of a dbt project - models, sources, tests,
    exposures, lineage/DAG, and execution results - queried with a Metadata Only service token against
    metadata.cloud.getdbt.com/graphql.
