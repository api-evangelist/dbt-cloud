aid: dbt-cloud
url: https://raw.githubusercontent.com/api-evangelist/dbt-cloud/refs/heads/main/apis.yml
name: dbt Cloud
kind: company
description: dbt Cloud is the analytics-engineering platform from dbt Labs for transforming
  data in the warehouse. It exposes the Administrative API for managing accounts, projects,
  jobs, runs, and environments, the Discovery (Metadata) API for project metadata and
  lineage via GraphQL, and the Semantic Layer API for querying governed metrics over
  GraphQL and JDBC.
